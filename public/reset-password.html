<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>إعادة تعيين كلمة المرور · ميمز كاميو</title>
<meta name="robots" content="noindex,nofollow"/>
<meta name="description" content="إعادة تعيين كلمة مرور لوحة التحكم"/>
<link rel="icon" type="image/png" href="/assets/favicon.png"/>
<link rel="stylesheet" href="/assets/fonts.css"/>
<link rel="stylesheet" href="/assets/store.css"/>
<style>
  .doc{max-width:860px;margin:0 auto;padding:clamp(32px,6vw,64px) var(--gutter);}
  .doc-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(22px,4vw,44px);box-shadow:var(--shadow-sm);}
  .doc-logo{height:72px;width:auto;margin-bottom:22px;}
  .doc h1{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.25;margin-bottom:4px;}
  .doc .updated{color:var(--olive-2);font-size:14px;margin-bottom:10px;}
  .doc h2{font-family:var(--font-display);font-weight:600;font-size:20px;color:var(--rose-ink);margin:28px 0 6px;}
  .doc p,.doc li{color:var(--olive-2);font-size:16px;line-height:1.9;}
  .doc ul{padding-inline-start:22px;}
  .doc a{color:var(--rose-ink);font-weight:600;}
  .doc .en-block{direction:ltr;text-align:left;border-top:1px solid var(--line);margin-top:32px;padding-top:20px;}
  .doc .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
  .doc .actions a{text-decoration:none;}
</style>
</head>
<body>
<main class="doc"><article class="doc-card">
  <a href="/"><img class="doc-logo" src="/assets/meemz-logo.png" alt="ميمز كاميو · Meemz Cameo"/></a>
  <h1>إعادة تعيين كلمة المرور</h1>
  <p class="updated">أدخلي بريدك والرمز من الرابط وكلمة المرور الجديدة.</p>
  <div class="form-group" style="margin-top:20px"><label class="form-label" for="rpEmail">البريد الإلكتروني</label><input class="form-input" id="rpEmail" type="email" dir="ltr" autocomplete="username"/></div>
  <div class="form-group"><label class="form-label" for="rpToken">الرمز (من الرابط)</label><input class="form-input" id="rpToken" dir="ltr"/></div>
  <div class="form-group"><label class="form-label" for="rpPass">كلمة المرور الجديدة</label><input class="form-input" id="rpPass" type="password" autocomplete="new-password"/></div>
  <button class="btn-primary" type="button" onclick="doReset()">إعادة التعيين</button>
  <p id="msg" style="margin-top:14px"></p>
  <script>
  (function(){var p=new URLSearchParams(location.search);if(p.get('token'))document.getElementById('rpToken').value=p.get('token');if(p.get('email'))document.getElementById('rpEmail').value=p.get('email');})();
  async function doReset(){
    var email=document.getElementById('rpEmail').value.trim(),token=document.getElementById('rpToken').value.trim(),pass=document.getElementById('rpPass').value,msg=document.getElementById('msg');
    if(!email||!token||!pass){msg.textContent='يرجى تعبئة جميع الحقول';return;}
    try{var res=await fetch('/api/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,token:token,password:pass})});var j=await res.json();
    msg.textContent=j.ok||j.success?'تمت إعادة تعيين كلمة المرور. يمكنك الآن تسجيل الدخول من /admin.html':'تعذرت إعادة التعيين: '+(j.error||'');}catch(e){msg.textContent='تعذر الاتصال بالخادم';}
  }
  </script>
  <div class="actions">
    <a class="btn-primary" href="/">العودة للمتجر</a>
    <a class="btn-ghost" href="/admin.html">تسجيل الدخول</a>
  </div>
</article></main>
</body>
</html>
